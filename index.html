<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zapiekankasebastian</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Tło -->
    <div class="background">
        <img src="background.jpg" alt="Background">
    </div>

    <!-- Główna karta -->
    <div class="profile-card">
        <!-- Awatar -->
        <div class="avatar">
            <img src="unnamed.jpg" alt="Avatar">
        </div>

        <!-- Nazwa użytkownika -->
        <h1 class="username">Seb</h1>

        <!-- Powitanie -->
        <p class="welcome-text">Welcome</p>

        <!-- Ikony społecznościowe -->
        <div class="social-links">
            <a href="https://open.spotify.com/user/31v6vltmxpdibbqtckfwrj5ornuu?si=b06200ecc4ed48db" class="social-icon"><i class="fab fa-spotify"></i></a>
            <a href="https://www.youtube.com/@seb-1-h" target="_blank" class="social-icon"><i class="fab fa-youtube"></i></a>
            <a href="https://github.com/seb1kz" target="_blank" class="social-icon"><i class="fab fa-github"></i></a>
        </div>
    </div>
    <script>
        // Efekty przy ładowaniu
    document.addEventListener('DOMContentLoaded', () => {
        const card = document.querySelector('.profile-card');
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        
        setTimeout(() => {
            card.style.transition = 'all 0.6s ease';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
        }, 100);
    });

    // Efekt paralaksy dla tła (opcjonalnie)
    document.addEventListener('mousemove', (e) => {
        const bg = document.querySelector('.background img');
        const x = (window.innerWidth - e.pageX * 2) / 100;
        const y = (window.innerHeight - e.pageY * 2) / 100;
        bg.style.transform = `translate(${x}px, ${y}px)`;
    });
    </script>
</body>
</html>
